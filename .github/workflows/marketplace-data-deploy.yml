name: Deploy marketplace data plane

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: marketplace-data-production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: marketplace-production
    defaults:
      run:
        working-directory: infra/marketplace-data
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.13.5 }
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_MARKETPLACE_APPLY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Initialize protected remote state
        run: >-
          terraform init -input=false
          -backend-config="bucket=${{ vars.AWS_MARKETPLACE_STATE_BUCKET }}"
          -backend-config="key=marketplace-data/production.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="dynamodb_table=${{ vars.AWS_MARKETPLACE_LOCK_TABLE }}"
          -backend-config="encrypt=true"
      - name: Materialize protected release evidence
        env:
          RELEASE_TFVARS: ${{ secrets.MARKETPLACE_RELEASE_TFVARS }}
        run: |
          test -n "$RELEASE_TFVARS"
          install -m 600 /dev/null release.auto.tfvars
          printf '%s\n' "$RELEASE_TFVARS" > release.auto.tfvars
      - name: Plan exact production release
        run: >-
          terraform plan -input=false -lock-timeout=5m -out=release.tfplan
          -var="domain_name=${{ vars.MARKETPLACE_API_DOMAIN }}"
          -var="route53_zone_id=${{ vars.MARKETPLACE_ROUTE53_ZONE_ID }}"
          -var="github_repository=${{ github.repository }}"
          -var="terraform_state_bucket=${{ vars.AWS_MARKETPLACE_STATE_BUCKET }}"
          -var="terraform_lock_table=${{ vars.AWS_MARKETPLACE_LOCK_TABLE }}"
      - name: Apply reviewed plan
        run: terraform apply -input=false -auto-approve release.tfplan
